# MarbleRush on Fly.io. Follow DEPLOY.md: `fly launch --no-deploy --copy-config` picks the app name (it must be unique).
app = "marblerush"
primary_region = "iad"          # US East. Change to the region nearest your players (fly platform regions).

[build]

[env]
  PORT = "8080"
  MR_DATA = "/data"
  MR_CHAIN_DIR = "/data"
  MR_TRUST_PROXY = "fly"        # the client address is Fly-Client-IP. Only valid because the app is reachable only through Fly.
  MR_SECURE = "1"
  MR_REQUIRE_CHAIN = "1"        # refuse to start (instead of playing with demo money) if the house key secret is missing

[[mounts]]
  source = "mr_data"            # fly volumes create mr_data --size 1 --region iad
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # rounds, streams and payout jobs need a running process
  auto_start_machines = false   # a machine you stopped (to save money) stays stopped until you start it
  min_machines_running = 1

  # Fly's default is 25 connections; every open page holds one stream.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 700
    hard_limit = 800

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/ping"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
